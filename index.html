<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XPエラー画像ジェネレーター</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
      background: linear-gradient(135deg, #1e5799 0%, #3a7bd5 50%, #00d2ff 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      font-size: 1.5rem;
    }

    .editor {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
      font-size: 0.9rem;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 4px;
      font-size: 1rem;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #3a7bd5;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    .buttons-editor {
      display: flex;
      gap: 10px;
    }

    .buttons-editor input {
      flex: 1;
    }

    .preview-section {
      text-align: center;
    }

    .preview-label {
      color: white;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    /* XP Dialog Styles - Updated to match XP more accurately */
    .xp-dialog {
      display: inline-block;
      background: #ece9d8;
      border: 1px solid #0055ea;
      border-radius: 10px 10px 0 0;
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.1),
        3px 3px 12px rgba(0,0,0,0.3);
      font-family: 'Tahoma', 'MS UI Gothic', 'メイリオ', sans-serif;
      text-align: left;
      min-width: 380px;
      max-width: 520px;
    }

    .xp-titlebar {
      background: linear-gradient(180deg,
        #0997ff 0%,
        #0c7dea 10%,
        #0863ce 40%,
        #0654bf 60%,
        #0654bf 80%,
        #0863ce 90%,
        #0a8cf5 100%
      );
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 8px 8px 0 0;
    }

    .xp-title {
      color: white;
      font-size: 14px;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
      padding-left: 4px;
      letter-spacing: 0.5px;
    }

    .xp-close-btn {
      width: 22px;
      height: 22px;
      background: linear-gradient(180deg, #e88b7c 0%, #d45544 40%, #c73824 50%, #e07560 100%);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    .xp-close-btn span {
      color: white;
      font-size: 16px;
      font-weight: bold;
      text-shadow: 1px 1px 1px rgba(0,0,0,0.4);
      line-height: 22px;
      text-align: center;
    }

    .xp-content {
      padding: 20px 16px;
    }

    .xp-message-row {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 24px;
    }

    .xp-icon {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
    }

    .xp-icon svg {
      width: 100%;
      height: 100%;
    }

    .xp-text {
      flex: 1;
      padding-top: 2px;
    }

    .xp-headline {
      font-size: 14px;
      font-weight: bold;
      color: #000;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .xp-detail {
      font-size: 13px;
      color: #000;
      line-height: 1.6;
    }

    .xp-button-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding-top: 16px;
      border-top: 1px solid #d4d0c8;
    }

    .xp-button {
      min-width: 90px;
      padding: 6px 20px;
      font-size: 13px;
      font-family: 'Tahoma', 'MS UI Gothic', 'メイリオ', sans-serif;
      background: linear-gradient(180deg, #fff 0%, #f5f4f0 50%, #ece9d8 100%);
      border: 1px solid #7a7a7a;
      border-radius: 4px;
      color: #000;
      cursor: pointer;
      box-shadow:
        inset 1px 1px 0 #fff,
        inset -1px -1px 0 #c4c0b0;
    }

    .xp-button:first-child {
      outline: 1px dotted #000;
      outline-offset: -4px;
    }

    .save-hint {
      color: white;
      text-align: center;
      margin-top: 15px;
      font-size: 0.85rem;
      background: rgba(0,0,0,0.2);
      padding: 10px;
      border-radius: 5px;
    }

    .save-hint strong {
      display: block;
      margin-bottom: 5px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .create-btn {
      flex: 1;
      padding: 15px;
      background: linear-gradient(180deg, #5b9bd5 0%, #3a7bd5 100%);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    .download-btn {
      flex: 1;
      padding: 15px;
      background: linear-gradient(180deg, #5cb85c 0%, #449d44 100%);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    .create-btn:active, .download-btn:active {
      transform: scale(0.98);
    }

    /* Generated image preview */
    .generated-preview {
      margin-top: 20px;
      text-align: center;
    }

    .generated-preview img {
      max-width: 100%;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .generated-preview p {
      color: white;
      margin-top: 10px;
      font-size: 0.85rem;
    }

    #generatedImage {
      display: none;
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>XPエラー画像ジェネレーター</h1>

    <div class="editor">
      <div class="form-group">
        <label>ウィンドウタイトル</label>
        <input type="text" id="titleInput" value="エラー・TakaNoriの体調" oninput="updatePreview()">
      </div>

      <div class="form-group">
        <label>見出しメッセージ</label>
        <input type="text" id="headlineInput" value="TakaNoriの体調にエラーが発生しました" oninput="updatePreview()">
      </div>

      <div class="form-group">
        <label>詳細メッセージ</label>
        <textarea id="detailInput" oninput="updatePreview()">TakaNoriの体調に問題が発生しました。
すぐに休憩が必要です。</textarea>
      </div>

      <div class="form-group">
        <label>ボタン（空欄で非表示）</label>
        <div class="buttons-editor">
          <input type="text" id="btn1Input" value="再試行(R)" oninput="updatePreview()">
          <input type="text" id="btn2Input" value="無視(I)" oninput="updatePreview()">
          <input type="text" id="btn3Input" value="キャンセル" oninput="updatePreview()">
        </div>
      </div>

      <div class="btn-group">
        <button class="create-btn" onclick="createImage()">画像作成</button>
        <button class="download-btn" onclick="downloadImage()">ダウンロード</button>
      </div>
    </div>

    <div class="preview-section">
      <p class="preview-label">▼ プレビュー</p>

      <div class="xp-dialog" id="xpDialog">
        <div class="xp-titlebar">
          <span class="xp-title" id="previewTitle">エラー・TakaNoriの体調</span>
          <div class="xp-close-btn">
            <span>×</span>
          </div>
        </div>
        <div class="xp-content">
          <div class="xp-message-row">
            <div class="xp-icon">
              <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ff6b6b"/>
                    <stop offset="50%" stop-color="#dc3545"/>
                    <stop offset="100%" stop-color="#b52a37"/>
                  </linearGradient>
                </defs>
                <circle cx="24" cy="24" r="22" fill="url(#iconGrad)" stroke="#8b0000" stroke-width="1.5"/>
                <circle cx="24" cy="24" r="18" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
                <line x1="14" y1="14" x2="34" y2="34" stroke="white" stroke-width="5" stroke-linecap="round"/>
                <line x1="34" y1="14" x2="14" y2="34" stroke="white" stroke-width="5" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="xp-text">
              <div class="xp-headline" id="previewHeadline">TakaNoriの体調にエラーが発生しました</div>
              <div class="xp-detail" id="previewDetail">TakaNoriの体調に問題が発生しました。<br>すぐに休憩が必要です。</div>
            </div>
          </div>
          <div class="xp-button-row" id="previewButtons">
            <button class="xp-button">再試行(R)</button>
            <button class="xp-button">無視(I)</button>
            <button class="xp-button">キャンセル</button>
          </div>
        </div>
      </div>

      <div class="generated-preview" id="generatedPreview" style="display: none;">
        <p class="preview-label">▼ 生成された画像（長押し/右クリックで保存）</p>
        <img id="generatedImage" alt="生成されたXPエラー画像">
        <p>↑ この画像を長押し（スマホ）/ 右クリック（PC）で保存できます</p>
      </div>

      <p class="save-hint">
        <strong>使い方</strong>
        1. 上のフォームでメッセージを編集<br>
        2.「画像作成」ボタンで画像を生成<br>
        3. 生成された画像を保存 or「ダウンロード」ボタン
      </p>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    function updatePreview() {
      document.getElementById('previewTitle').textContent = document.getElementById('titleInput').value;
      document.getElementById('previewHeadline').textContent = document.getElementById('headlineInput').value;

      const detailText = document.getElementById('detailInput').value;
      document.getElementById('previewDetail').innerHTML = detailText.replace(/\n/g, '<br>');

      const btn1 = document.getElementById('btn1Input').value;
      const btn2 = document.getElementById('btn2Input').value;
      const btn3 = document.getElementById('btn3Input').value;

      let buttonsHtml = '';
      if (btn1) buttonsHtml += `<button class="xp-button">${escapeHtml(btn1)}</button>`;
      if (btn2) buttonsHtml += `<button class="xp-button">${escapeHtml(btn2)}</button>`;
      if (btn3) buttonsHtml += `<button class="xp-button">${escapeHtml(btn3)}</button>`;

      document.getElementById('previewButtons').innerHTML = buttonsHtml;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function createImage() {
      const dialog = document.getElementById('xpDialog');

      try {
        const canvas = await html2canvas(dialog, {
          backgroundColor: null,
          scale: 2,
          logging: false,
          useCORS: true
        });

        const imgData = canvas.toDataURL('image/png');
        const generatedImage = document.getElementById('generatedImage');
        const generatedPreview = document.getElementById('generatedPreview');

        generatedImage.src = imgData;
        generatedImage.style.display = 'block';
        generatedPreview.style.display = 'block';

        // Scroll to the generated image
        generatedPreview.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } catch (error) {
        alert('画像の生成に失敗しました。もう一度お試しください。');
        console.error(error);
      }
    }

    async function downloadImage() {
      const dialog = document.getElementById('xpDialog');

      try {
        const canvas = await html2canvas(dialog, {
          backgroundColor: null,
          scale: 2,
          logging: false,
          useCORS: true
        });

        const link = document.createElement('a');
        link.download = 'xp-error-' + Date.now() + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (error) {
        alert('画像の生成に失敗しました。もう一度お試しください。');
        console.error(error);
      }
    }

    // Initialize
    updatePreview();
  </script>

</body>
</html>
